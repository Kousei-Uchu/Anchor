<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anchor demo</title><link rel="icon" href="/assets/icon.png"><link rel="stylesheet" href="/assets/site.css">
<style>
html{scroll-snap-type:none}body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{padding:76px 12px 24px;text-align:center;width:100%}.wrap p.s{color:var(--mut);max-width:440px;margin:.2em auto .8em;font-size:.95rem}
.fit{margin:0 auto;position:relative}
.dev{position:absolute;left:0;top:0;width:413px;height:872px;border-radius:64px;background:#232020;padding:10px;transform-origin:0 0;box-shadow:var(--sh)}
.app{--A:#ca795f;--S:#94a88c;--bg:#fbf6f1;--cd:#fff;--tx:#1d1b1a;--sec:#7b7370;--sep:#e4dcd5;position:relative;width:393px;height:852px;border-radius:54px;overflow:hidden;background:var(--bg);color:var(--tx);text-align:left;font:17px/1.3 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
@media(prefers-color-scheme:dark){.app{--bg:#1c1a1a;--cd:#2b2826;--tx:#f5efe9;--sec:#a69c95;--sep:#3a3533}}
.sb{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);position:absolute;inset:0 0 auto;height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 34px 8px;font:600 16px -apple-system,system-ui;z-index:9}
.isl{position:absolute;top:11px;left:50%;translate:-50% 0;width:120px;height:34px;border-radius:20px;background:#000;z-index:10}
.pane{position:absolute;inset:0 0 83px;overflow-y:auto;padding:54px 0 24px;display:none;scrollbar-width:none}.pane::-webkit-scrollbar{display:none}.pane.on{display:block}
.nt{font-size:34px;font-weight:700;padding:6px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.pad{padding:0 16px}.stack>*+*{margin-top:16px}
.card{background:var(--cd);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--A)) 12%,transparent)}.card.sg{--c:var(--S)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:600}.sh i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--A)) 16%,transparent);color:var(--c,var(--A))}.card.sg .sh i{--c:var(--S)}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub{font-size:15px;color:var(--sec)}.cap{font-size:12px;color:var(--sec)}
.btn{display:block;width:100%;border:0;border-radius:99px;background:var(--A);color:#fff;font:600 15px ui-rounded,-apple-system,system-ui;padding:11px 16px;text-align:center;cursor:pointer}
.btn:active{opacity:.78}.btn.sec{background:color-mix(in srgb,var(--A) 14%,transparent);color:var(--A);font-weight:500;padding:8px 14px;display:inline-block;width:auto}.btn.sec.g{background:color-mix(in srgb,var(--S) 20%,transparent);color:var(--S)}
.crisis{background:linear-gradient(135deg,rgba(255,59,48,.85),rgba(255,59,48,.65));border-radius:16px;padding:14px;color:#fff}.crisis b{font-size:17px}.crisis .row{display:flex;justify-content:space-between;margin-top:8px;font-size:15px}.crisis .rg{margin-top:10px;font-size:12px;opacity:.85}
.mas{display:flex;align-items:flex-end;gap:12px}.mb{position:relative;width:64px;height:64px;border-radius:28px;background:linear-gradient(rgba(202,121,95,.9),rgba(202,121,95,.65));flex:none;box-shadow:0 4px 6px rgba(202,121,95,.25);animation:br 2.4s ease-in-out infinite alternate}
.mb:before,.mb:after{content:"";position:absolute;top:19px;width:7px;height:9px;border-radius:5px;background:#fff;animation:bl 5s infinite}.mb:before{left:21px}.mb:after{right:21px}
.mb svg{position:absolute;left:26px;bottom:8px;width:12px;height:13px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
@keyframes br{from{scale:.98}to{scale:1.04}}@keyframes bl{0%,95%,100%{height:9px}97%{height:1.5px}}
.bub{position:relative;margin-left:8px;background:var(--cd);border-radius:16px;padding:10px 14px;font-size:16px;box-shadow:inset 0 0 0 1px rgba(202,121,95,.15)}.bub:before{content:"";position:absolute;left:-8px;bottom:12px;border:6px solid transparent;border-right:8px solid var(--cd);border-left:0}
.row2{display:flex;align-items:center;gap:10px}.sp{flex:1}.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--A);flex:none;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:12px}.chk.on{background:var(--A)}
.in{width:100%;border:0;border-radius:10px;background:color-mix(in srgb,var(--sec) 14%,transparent);color:var(--tx);font:inherit;font-size:16px;padding:9px 12px;outline:0}
.tr{margin-top:20px}.tr h4{margin:0 16px 10px;font-size:15px;color:var(--sec);font-weight:600}.tl{display:flex;gap:14px;padding:0 16px 4px;overflow-x:auto;scrollbar-width:none}.tl::-webkit-scrollbar{display:none}
.tile{width:88px;flex:none;text-align:center;font-size:12px;font-weight:500;cursor:pointer;background:none;border:0;color:var(--tx);font-family:inherit}.tile i{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 8px;border-radius:16px;background:color-mix(in srgb,var(--c,var(--A)) 15%,transparent);color:var(--c,var(--A))}.tile.sg i{--c:var(--S)}.tile svg.ic{width:24px;height:24px;stroke-width:1.8}.tile span{display:block;height:32px}
.note{margin:6px 16px 0;font-size:12px;color:var(--sec)}
.day{display:flex;align-items:center;gap:10px;padding:14px 0 6px;font-size:13px;font-weight:600;color:var(--sec)}.day:after{content:"";flex:1;height:1px;background:var(--sep)}
.ent{border-left:2px solid color-mix(in srgb,var(--A) 35%,transparent);margin-left:6px;padding:4px 0 10px 14px}.ent .card{padding:12px 14px;font-size:16px}.ent .cap{margin-bottom:4px}
.srch{margin:0 16px 8px;display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--sec) 14%,transparent);border-radius:12px;padding:8px 10px;color:var(--sec);font-size:16px}
.tab{position:absolute;inset:auto 0 0;height:83px;display:flex;padding:8px 6px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--sep);z-index:8}
.tab button{flex:1;border:0;background:none;color:var(--sec);font:500 10px -apple-system,system-ui;display:flex;flex-direction:column;align-items:center;gap:3px;height:49px;cursor:pointer}.tab button.on{color:var(--A)}.tab svg.ic{width:25px;height:25px;stroke-width:1.8}
.hi{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:139px;height:5px;border-radius:3px;background:var(--tx);opacity:.9;z-index:12}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s;z-index:20}.ov.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset:44px 0 0;background:var(--bg);border-radius:38px 38px 0 0;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:21;overflow-y:auto;padding:18px 16px 40px}.sheet.on{transform:none}
.sheet h3{font-size:20px;margin:0 0 4px;text-align:center}.sl{margin:14px 0}.sl input{width:100%;accent-color:var(--A)}
.alert{position:absolute;left:36px;right:36px;top:50%;translate:0 -50%;background:var(--cd);border-radius:20px;padding:20px;text-align:center;z-index:31;display:none}.alert.on{display:block}
.toast{position:absolute;left:20px;right:20px;bottom:96px;background:#232020;color:#fff;border-radius:16px;padding:12px 14px;font-size:14px;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none;z-index:40}.toast.on{opacity:1;transform:none}
.emb .hdr,.emb .wrap>:not(.fit){display:none}.emb .wrap{padding:0}.emb,.emb body{background:transparent;margin:0}.emb .fit{margin:0 auto}.emb .dev{box-shadow:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="anc" viewBox="0 0 100 112"><circle cx="50" cy="11" r="8.5"/><path d="M50 20V104M36 31H64M16 76C16 98 33 107 50 107S84 98 84 76M8 87L16 75L26 86M92 87L84 75L74 86"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
<symbol id="map" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></symbol>
<symbol id="pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></symbol>
<symbol id="swap" viewBox="0 0 24 24"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M3 5h11v8H8l-3 3v-3H3zM17 9h4v8h-2v3l-3-3h-4v-2"/></symbol>
<symbol id="msg" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>

<symbol id="ml" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 8l9 6 9-6"/></symbol>

<symbol id="grid" viewBox="0 0 24 24"><circle cx="8" cy="7" r="2.5"/><circle cx="16" cy="7" r="2.5"/><circle cx="12" cy="13" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/></symbol>
<symbol id="phn" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="sch" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
</defs></svg>
<header class="hdr"><a class="brand" href="/"><img src="/assets/icon.png" alt="">Anchor</a><nav><a href="/">Home</a><a href="/privacy">Privacy</a><a href="/support">Support</a><a class="pill" href="/#status">Early build</a></nav></header>
<div class="wrap"><p class="s"><strong>Interactive demo.</strong> Rebuilt from the real app's screens, with made-up content. Nothing you type is saved or sent.</p>
<div class="fit" id="fit"><div class="dev" id="dev"><div class="app" id="app"></div></div></div></div>
<script>
const I=n=>`<svg class="ic"><use href="#${n}"/></svg>`;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const MAS=`<div class="mb"><svg><use href="#anc"/></svg></div>`;
const SH=(ic,t,c)=>`<div class="sh"><i>${I(ic)}</i><span>${t}</span></div>`;
const tile=(ic,t,sg)=>`<button class="tile${sg?' sg':''}" data-open="${t}"><i>${I(ic)}</i><span>${t}</span></button>`;
const trow=(t,tiles)=>`<div class="tr"><h4>${t}</h4><div class="tl">${tiles}</div></div>`;
const S={items:['Drink some water'],scripts:["I need 10 minutes, then we can talk.","I'm not okay right now. I need space, not a conversation.","Can we pause this? I'll come find you when I've calmed down."],si:0,aff:["I got through today. That counts.","Small steps still move me forward.","I don't have to figure it all out tonight."],ai:0,entries:[{t:'Slept badly, but the walk helped a bit.',h:'Yesterday, 8:12 pm'}],gi:0,tool:null,line:"Hey. I'm here."};
const TOOLS={"5-4-3-2-1":["Name 5 things you can see.","Name 4 things you can touch.","Name 3 things you can hear.","Name 2 things you can smell.","Take 1 slow breath."],"Cold water":["Go to a tap.","Run cold water over your wrists.","Breathe out slowly, twice."]};
const PROMPTS=["What's currently on your mind?","What's your biggest emotion right now?","What's something you're looking forward to?"];
function now(){return `<div class="nt">Now<span style="color:var(--A)">${I('cog')}</span></div><div class="pad stack">
<div class="crisis"><b>${I('shield')} Crisis numbers</b><div class="row"><span>Emergency</span><span>000</span></div><div class="row"><span>Lifeline (call)</span><span>13 11 14</span></div><div class="row"><span>Lifeline (text)</span><span>0477 13 11 14</span></div><div class="rg">Numbers for Australia. Change</div></div>
<div class="mas">${MAS}<div class="bub">${S.line}</div></div>
<button class="btn" data-open="checkin">${I('grid')} Check in</button>
<div class="card">${SH('msg','Quick contact')}<div class="row2"><div class="sp"><b>Sam</b><div class="sub">Trusted</div></div><button class="btn sec" data-call="Sam">Call</button><button class="btn sec" data-toast="Messages would open with a message ready to review.">Message</button></div></div>
<div class="card">${SH('cal','Next appointment')}<b>Dr Lee</b><div class="sub">Tuesday, 10:30 am</div></div>
<button class="btn sec" style="display:block;width:100%;text-align:center" data-open="Safety plan">Open my safety plan</button>
<div class="card">${SH('lst','Decision presets')}<div class="sub" style="margin-bottom:10px">One less thing to decide right now. Tap a category's top pick, or see all your options.</div><button class="btn sec" data-toast="Outfit: grey hoodie">Outfit</button> <button class="btn sec" data-toast="Food: toast">Food</button> <button class="btn sec" data-toast="Morning routine: shower first">Morning routine</button></div>
<div class="card sg">${SH('leaf','Grounding tools')}${Object.keys(TOOLS).map(k=>`<button class="btn sec g" data-tool="${k}" style="margin:0 8px 8px 0">${k}</button>`).join('')}</div>
<div class="card"><div class="sh"><i>${I('hg')}</i><span>Next hour only</span></div>${S.items.length?S.items.map((t,i)=>`<div class="row2" style="margin-bottom:10px"><span class="chk" data-chk="${i}"></span><span class="sp">${t}</span></div>`).join(''):'<div class="sub">Nothing added yet.</div>'}<input class="in" id="ni" placeholder="Add something small"></div>
<div class="card sg">${SH('wind','De-escalation script')}<div style="font-size:17px;margin-bottom:12px">\u201C${S.scripts[S.si]}\u201D</div><button class="btn sec g" data-act="script">Try another</button></div>
<div class="card"><div class="sh"><i>${I('spk')}</i><span>Something to hold onto</span></div><div style="font-size:17px;margin-bottom:12px">${S.aff[S.ai]}</div><button class="btn sec" data-act="aff">Another</button></div></div>`}
function plan(){return `<div class="nt">Plan</div>`+trow('Safety & people',tile('ppl','Contacts')+tile('shield','Safety plan')+tile('clk','Trigger windows',1)+tile('cal','Appointments',1))+trow('Presets & tools',tile('leaf','Grounding tools',1)+tile('lst','Decision presets')+tile('wind','De-escalation',1)+tile('spk','Affirmations'))+trow('Data',tile('drv','Your data'))+`<div class="pad" style="margin-top:20px"><div class="card sg">${SH('cog','Preferences')}<div class="row2"><span class="sp">Lock with Face ID</span><span class="chk on" style="background:var(--S);border-color:var(--S)">\u2713</span></div></div></div>`}
function jrn(){return `<div class="nt">Journal<span style="color:var(--A)" data-open="newentry">${I('plus')}</span></div><div class="srch">${I('sch')} Search your journal</div><div class="pad"><div class="day">Today</div>${S.entries.map(e=>`<div class="ent"><div class="cap">${e.h}</div><div class="card">${e.t}</div></div>`).join('')}</div>`}
function brg(){return `<div class="nt">Bridge</div>`+trow('For your psych',tile('doc','Draft notes')+tile('clip','Session prep')+tile('note','Post-session notes'))+trow('Tools & reference',tile('loop','Reframing',1)+tile('net','Feedback loops',1))}
function thr(){return `<div class="nt">Thread</div>`+trow('With someone',tile('chat','Message log')+tile('cal','Support calendar'))+`<div class="note">Message log is tied to a real contact and can actually send.</div>`+trow('Just for you',tile('ml','To future me',1)+tile('sq',"Things I haven't said",1))+`<div class="note">"Things I haven't said" is for big things you might never send, to anyone.</div>`}
const TABS=[['Now','sun',now],['Plan','map',plan],['Journal','pen',jrn],['Bridge','swap',brg],['Thread','chat',thr]];
let cur=0;
function render(){const keep=$('.pane.on')?$('.pane.on').scrollTop:0;
$('#app').innerHTML=`<div class="sb"><span>9:41</span><span>\u25CF\u25CF\u25CF</span></div><div class="isl"></div>${TABS.map((t,i)=>`<div class="pane${i===cur?' on':''}">${t[2]()}</div>`).join('')}<div class="tab">${TABS.map((t,i)=>`<button class="${i===cur?'on':''}" data-tab="${i}">${I(t[1])}${t[0]}</button>`).join('')}</div><div class="ov" id="ov"></div><div class="sheet" id="sheet"></div><div class="alert" id="al"></div><div class="toast" id="toast"></div><div class="hi"></div>`;
if($('.pane.on'))$('.pane.on').scrollTop=keep}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function sheet(html){$('#sheet').innerHTML=html;$('#sheet').classList.add('on');$('#ov').classList.add('on')}
function close(){$('#sheet').classList.remove('on');$('#ov').classList.remove('on');$('#al').classList.remove('on')}
const hd=t=>`<div class="row2" style="margin-bottom:10px"><button class="btn sec" data-close>Cancel</button><div class="sp"></div></div><h3>${t}</h3>`;
function checkin(stage,i){if(stage==='p')return sheet(`${hd('Check in')}<div class="sub" style="text-align:center">Question ${i+1} of ${PROMPTS.length}, skip any of these</div><div style="font-size:20px;margin:24px 0;text-align:center">${PROMPTS[i]}</div><input class="in" placeholder="Optional"><div style="margin-top:20px"><button class="btn" data-pn="${i}">${i<PROMPTS.length-1?'Next':'Finish'}</button></div><div style="margin-top:10px;text-align:center"><button class="btn sec" data-fin>Finish now, skip the rest</button></div>`);
sheet(`${hd('Check in')}<div class="mas" style="margin:14px 0">${MAS}<div class="bub">Want to check in? Totally fine to skip.</div></div><div class="card">${['Physical energy','Mental clarity','Room in your head','Physical energy to move','Social energy'].map(l=>`<div class="sl">${l}<input type="range" min="0" max="100" value="50"></div>`).join('')}<div class="cap">More = better, across all five. Just for you, nothing here is scored, averaged, or shown as a streak.</div></div><div style="margin-top:16px"><button class="btn" data-fin>Finish</button></div><div style="margin-top:10px;text-align:center"><button class="btn sec" data-cp>A few optional questions</button></div><div class="cap" style="text-align:center;margin-top:8px">Finishing here is complete. The questions are extra, not required.</div>`)}
function tool(k,i){const st=TOOLS[k];sheet(`${hd(k)}<div class="cap" style="text-align:center">Step ${i+1} of ${st.length}</div><div style="font-size:22px;margin:30px 0;text-align:center">${st[i]}</div><div class="row2"><button class="btn sec" data-gb="${k}|${i}">Back</button><div class="sp"></div><button class="btn" style="width:auto;padding:11px 30px" data-gn="${k}|${i}">${i<st.length-1?'Next':'Close'}</button></div>`)}
$('#app').addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-open],[data-close],[data-act],[data-tool],[data-chk],[data-call],[data-toast],[data-fin],[data-cp],[data-pn],[data-gn],[data-gb],[data-doit],.ov');if(!t)return;const d=t.dataset;
if(d.tab!==undefined){cur=+d.tab;close();render();return}
if(t.classList.contains('ov')||d.close!==undefined){close();return}
if(d.open==='checkin')return checkin('s');
if(d.open==='newentry')return sheet(`${hd('New entry')}<textarea class="in" id="ne" rows="8" placeholder="Write something\u2026" style="margin-top:12px"></textarea><div style="margin-top:14px"><button class="btn" data-doit="save">Save</button></div>`);
if(d.doit==='save'){const v=$('#ne').value.trim();if(v)S.entries.unshift({t:v.replace(/</g,'&lt;'),h:'Just now'});close();render();return}
if(d.open)return sheet(`${hd(d.open)}<div class="card" style="margin-top:14px">This opens <b>${d.open}</b> in the full app. This demo covers the main screens.</div>`);
if(d.act==='script'){S.si=(S.si+1)%S.scripts.length;render();return}
if(d.act==='aff'){S.ai=(S.ai+1)%S.aff.length;render();return}
if(d.tool)return tool(d.tool,0);
if(d.gn){const[k,i]=d.gn.split('|');const n=+i+1;if(n>=TOOLS[k].length)close();else tool(k,n);return}
if(d.gb){const[k,i]=d.gb.split('|');tool(k,Math.max(0,+i-1));return}
if(d.chk!==undefined){t.classList.toggle('on');t.textContent=t.classList.contains('on')?'\u2713':'';return}
if(d.call){$('#al').innerHTML=`<b>Call ${d.call}?</b><div class="sub" style="margin:6px 0 16px">This is the confirmation screen the widget opens.</div><button class="btn" data-toast="Calling (demo only)">Call</button><div style="margin-top:8px"><button class="btn sec" data-close>Cancel</button></div>`;$('#al').classList.add('on');$('#ov').classList.add('on');return}
if(d.toast){close();toast(d.toast);return}
if(d.fin!==undefined){S.line="No pressure to do anything right now.";close();render();return}
if(d.cp!==undefined)return checkin('p',0);
if(d.pn!==undefined){const n=+d.pn+1;if(n>=PROMPTS.length){S.line="No pressure to do anything right now.";close();render()}else checkin('p',n)}});
$('#app').addEventListener('keydown',e=>{if(e.target.id==='ni'&&e.key==='Enter'&&e.target.value.trim()){S.items.push(e.target.value.trim().replace(/</g,'&lt;'));render()}});
function fit(){const emb=document.documentElement.classList.contains('emb');const aw=innerWidth-(emb?0:24),ah=innerHeight-(emb?0:130);const s=Math.min(emb?9:1,aw/413,ah/872);$('#dev').style.transform=`scale(${s})`;$('#fit').style.width=413*s+'px';$('#fit').style.height=872*s+'px'}
if(location.search.includes('embed'))document.documentElement.classList.add('emb');
render();fit();addEventListener('resize',fit);
addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data||{};if(m.tab!=null&&m.tab!==cur){cur=m.tab;close();render()}const pn=$('.pane.on');if(pn&&m.scroll!=null)pn.scrollTo({top:m.scroll,behavior:'smooth'})});
</script></body></html>
